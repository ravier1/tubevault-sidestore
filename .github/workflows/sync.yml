name: Sync and Transform Repo for SideStore

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Transform and Generate repo.json
        run: |
          python3 - << 'EOF'
          import json
          import urllib.request

          url = "https://repo.ballermc.com/repo.json"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())

          # Metadata customization for your SideStore repo
          data['name'] = "TubeVault SideStore"
          data['identifier'] = "com.tubevault.sidestore.repo"
          data['subtitle'] = "SideStore-compatible YouTube mods mirror"
          data['description'] = "An auto-synced mirror of BallerMC's repository filtered for YouTube apps and optimized for SideStore."

          # Filter apps and normalize YouTube bundle IDs
          filtered_apps = []
          for app in data.get("apps", []):
              dev_name = app.get("developerName", "").lower()
              bundle_id = app.get("bundleIdentifier", "").lower()
              app_name = app.get("name", "").lower()
              
              # Exclude Spotify apps
              if "spotify" in dev_name or "spotify" in bundle_id or "spotify" in app_name:
                  continue
              
              # Normalize YouTube bundle identifier for SideStore validation if needed
              if "bundleIdentifier" in app and "com.google.ios.youtube" in app["bundleIdentifier"]:
                  app["bundleIdentifier"] = "com.google.ios.youtube"
                  
              filtered_apps.append(app)

          data['apps'] = filtered_apps

          with open('repo.json', 'w') as f:
              json.dump(data, f, indent=4)
              
          print(f"Generated repo.json with {len(filtered_apps)} apps.")
          EOF

      - name: Commit and push repo.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync and filter repo.json" && git push)