name: Sync and Fix Bundle IDs for SideStore

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Process IPAs and Generate Accurate repo.json
        run: |
          python3 - << 'EOF'
          import json
          import urllib.request
          import zipfile
          import io
          import plistlib

          url = "https://repo.ballermc.com/repo.json"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())

          data['name'] = "TubeVault SideStore"
          data['identifier'] = "com.tubevault.sidestore.repo"
          data['subtitle'] = "Auto-synced SideStore repo with verified bundle IDs"

          print(f"Processing {len(data.get('apps', []))} apps to extract real bundle IDs...")

          for app in data.get("apps", []):
              # Find the download URL for the latest version
              versions = app.get("versions", [])
              if not versions:
                  continue
              
              # Take the first version's download URL to inspect the IPA
              ipa_url = versions[0].get("downloadURL")
              if not ipa_url:
                  continue

              try:
                  # Download just the beginning/headers of the IPA or stream it to read Info.plist
                  # IPAs are zip files, and Info.plist is inside Payload/*.app/Info.plist
                  req_ipa = urllib.request.Request(ipa_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req_ipa, timeout=15) as ipa_resp:
                      # Read content into memory (limiting memory load by using BytesIO)
                      ipa_data = io.BytesIO(ipa_resp.read())
                  
                  with zipfile.ZipFile(ipa_data) as z:
                      # Find the Info.plist file inside the Payload app directory
                      plist_path = None
                      for filename in z.namelist():
                          if filename.startswith("Payload/") and filename.endswith(".app/Info.plist"):
                              plist_path = filename
                              break
                      
                      if plist_path:
                          with z.open(plist_path) as plist_file:
                              plist_data = plistlib.load(plist_file)
                              real_bundle_id = plist_data.get("CFBundleIdentifier")
                              if real_bundle_id:
                                  app["bundleIdentifier"] = real_bundle_id
                                  print(f"Matched: {app.get('name')} -> {real_bundle_id}")
              except Exception as e:
                  # Fallback gracefully if an IPA download fails or times out
                  print(f"Skipped bundle ID extraction for {app.get('name')}: {e}")

          with open('repo.json', 'w') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
              
          print("Successfully updated repo.json with verified internal bundle IDs!")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-extract real bundle IDs from IPAs" && git push)
