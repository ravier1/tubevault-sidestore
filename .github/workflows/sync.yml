name: Sync Repo for SideStore

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate clean repo.json
        run: |
          python3 - << 'EOF'
          import json
          import urllib.request

          url = "https://repo.ballermc.com/repo.json"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())

          # Customize repository metadata while keeping original apps intact
          data['name'] = "TubeVault SideStore"
          data['identifier'] = "com.tubevault.sidestore.repo"
          data['subtitle'] = "Complete mirror of TubeVault apps"

          # Normalize YouTube bundle IDs for SideStore compatibility without dropping items
          for app in data.get("apps", []):
              if "bundleIdentifier" in app and "com.google.ios.youtube" in app["bundleIdentifier"]:
                  app["bundleIdentifier"] = "com.google.ios.youtube"

          with open('repo.json', 'w') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
              
          print(f"Successfully generated repo.json with {len(data.get('apps', []))} apps.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update repo.json with all apps" && git push)
