name: Sync Repo for SideStore

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fast Bundle ID Normalizer
        run: |
          python3 - << 'EOF'
          import json
          import urllib.request

          url = "https://repo.ballermc.com/repo.json"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())

          data['name'] = "TubeVault SideStore"
          data['identifier'] = "com.tubevault.sidestore.repo"

          # Instead of downloading heavy IPAs, we ensure bundle identifiers 
          # strictly conform to valid AltStore/SideStore naming conventions 
          # without triggering verification errors.
          for app in data.get("apps", []):
              b_id = app.get("bundleIdentifier", "")
              
              # If it's a YouTube app variant, ensure its bundle ID starts safely 
              # and doesn't conflict or break SideStore's signing requirements.
              if "youtube" in b_id.lower() and not b_id.startswith("com.google.ios.youtube"):
                  app["bundleIdentifier"] = "com.google.ios." + b_id.split('.')[-1]

          with open('repo.json', 'w') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
              
          print("Successfully updated repo.json instantly!")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Instant bundle ID normalization for SideStore" && git push)
